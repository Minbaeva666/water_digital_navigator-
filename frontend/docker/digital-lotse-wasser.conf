<VirtualHost *:80>
    ServerName www.digital-lotse-wasser.org
    ServerAlias digital-lotse-wasser.org
    DocumentRoot /var/www/html/typo3-composer/.build/web

    # === Let's Encrypt ===
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    <Directory /var/www/html/typo3-composer/.build/web>
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # Allow maintenance assets
    RewriteRule ^/maintenance\.html$ - [L]
    RewriteRule ^/dilowaMaintenance\.png$ - [L]

    # Force 503 for everything else
    RewriteRule ^.*$ - [R=503,L]

    # Show this file for 503
    ErrorDocument 503 /maintenance.html
</VirtualHost>


<VirtualHost *:443>
    ServerName www.digital-lotse-wasser.org
    ServerAlias digital-lotse-wasser.org
    DocumentRoot /var/www/html/typo3-composer/.build/web

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/www.digital-lotse-wasser.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.digital-lotse-wasser.org/privkey.pem

    <Directory /var/www/html/typo3-composer/.build/web>
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # Allow maintenance assets
    RewriteRule ^/maintenance\.html$ - [L]
    RewriteRule ^/dilowaMaintenance\.png$ - [L]

    # Force 503 for everything else
    RewriteRule ^.*$ - [R=503,L]

    # Show this file for 503
    ErrorDocument 503 /maintenance.html
</VirtualHost>
