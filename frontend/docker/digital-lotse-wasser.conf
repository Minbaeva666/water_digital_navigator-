<VirtualHost *:80>
    ServerName 192.168.84.86
    ServerAlias www.digital-lotse-wasser.org digital-lotse-wasser.org
    DocumentRoot /var/www/html

    RedirectMatch 302 ^/$ /dilowa/

    # === Let's Encrypt ===
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /dilowa/api http://127.0.0.1:3001/api
    ProxyPassReverse /dilowa/api http://127.0.0.1:3001/api

    ProxyPass /dilowa/uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /dilowa/uploads/ http://127.0.0.1:3001/uploads/

    ProxyPass /dilowa/ http://127.0.0.1:8080/dilowa/
    ProxyPassReverse /dilowa/ http://127.0.0.1:8080/dilowa/
</VirtualHost>


<VirtualHost *:443>
    ServerName www.digital-lotse-wasser.org
    ServerAlias digital-lotse-wasser.org
    DocumentRoot /var/www/html

    RedirectMatch 302 ^/$ /dilowa/

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/www.digital-lotse-wasser.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.digital-lotse-wasser.org/privkey.pem

    ProxyPreserveHost On
    ProxyPass /dilowa/api http://127.0.0.1:3001/api
    ProxyPassReverse /dilowa/api http://127.0.0.1:3001/api

    ProxyPass /dilowa/uploads/ http://127.0.0.1:3001/uploads/
    ProxyPassReverse /dilowa/uploads/ http://127.0.0.1:3001/uploads/

    ProxyPass /dilowa/ http://127.0.0.1:8080/dilowa/
    ProxyPassReverse /dilowa/ http://127.0.0.1:8080/dilowa/
</VirtualHost>
