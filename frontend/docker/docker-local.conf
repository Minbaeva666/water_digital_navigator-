<VirtualHost *:80>
    ServerName localhost
    ProxyPreserveHost On

  RedirectMatch 302 ^/$ /dilowa/

    # Proxy /api/ to backend
    ProxyPass "/api/" "http://backend:3001/api/"
    ProxyPassReverse "/api/" "http://backend:3001/api/"

    # Serve the app under /dilowa/ because the SPA is built with base '/dilowa/'.
    Alias /dilowa/ "/usr/local/apache2/htdocs/dilowa/"
    <Directory "/usr/local/apache2/htdocs/dilowa">
      Options Indexes FollowSymLinks
      AllowOverride All
      Require all granted

      # SPA fallback for routes under /dilowa - inside Directory block
      <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
      </IfModule>
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
